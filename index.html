<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Позорники Москвы — общий счёт позора</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f9faff 0%, #f0f3fd 100%);
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        .hero { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #1f1f3a, #b14b42);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .subhead { color: #5a5f7a; margin-top: 0.5rem; }
        .table-card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .shame-table { width: 100%; border-collapse: collapse; }
        .shame-table th, .shame-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #ede7f0; }
        .shame-table th { background: #fefaf5; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        .rank-cell { font-weight: 800; color: #e6645c; font-size: 1.1rem; }
        .name-cell { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .points-cell { font-weight: 800; font-size: 1.5rem; color: #1f2b3c; }
        .dislike-btn {
            background: #f1e7e6;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #a03e36;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .dislike-btn:hover { background: #ffdad5; transform: scale(0.96); }
        .info-panel {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.8);
            border-radius: 1.8rem;
            padding: 0.8rem 1.5rem;
            gap: 1rem;
        }
        .reset-btn {
            background: none;
            border: 1px solid #ddd2e6;
            border-radius: 50px;
            padding: 0.3rem 1rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .reset-btn:hover { background: #f5eefb; }
        .footer-note { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #8a84a2; }
        @media (max-width: 650px) {
            .shame-table thead { display: none; }
            .shame-table tr { display: block; margin-bottom: 1rem; border: 1px solid #f0ebf3; border-radius: 1rem; background: white; }
            .shame-table td { display: flex; justify-content: space-between; align-items: center; }
            .shame-table td::before { content: attr(data-label); font-weight: 600; font-size: 0.7rem; color: #6c5b7b; }
        }
        .point-bump { animation: bump 0.2s ease; }
        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #e6645c; }
            100% { transform: scale(1); }
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1e2b;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>Позорники Москвы</h1>
        <div class="subhead"><i class="fas fa-globe"></i> единый счёт позора для всех посетителей</div>
    </div>
    <div class="table-card">
        <table class="shame-table">
            <thead><tr><th>#</th><th>Позорник</th><th>Позорное деяние</th><th>Баллы позора</th><th>Действие</th></tr></thead>
            <tbody>
                <tr>
                    <td data-label="#" class="rank-cell"><i class="fas fa-crown" style="color:#e6a017;"></i> 01</td>
                    <td data-label="Позорник" class="name-cell"><i class="fas fa-user-alt-slash"></i> Арсений Струков</td>
                    <td data-label="Позорное деяние">Абсолютный антирекорд столицы · позорный мем 2026</td>
                    <td data-label="Баллы позора" class="points-cell" id="pointsDisplay">0</td>
                    <td data-label="Действие"><button class="dislike-btn" id="dislikeBtn"><i class="fas fa-thumbs-down"></i> Дизлайк +1</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="info-panel">
        <span><i class="fas fa-chart-line"></i> Общий счёт позора: <strong id="totalPointsStat">0</strong></span>
        <button class="reset-btn" id="resetBtn"><i class="fas fa-trash-alt"></i> Сбросить</button>
    </div>
    <div class="footer-note">
        <i class="fas fa-cloud-upload-alt"></i> Баллы хранятся в облаке — видны всем. Нажмите дизлайк, чтобы увеличить позор Арсения.
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ==================== ВАШИ ДАННЫЕ JSONBIN ====================
    const BIN_ID = "69e3654c36566621a8c7cdc8";
    const API_KEY = "$2a$10$x7RrtwluOrONl9vFQ70e3.N3ylfNkZIHMGULEthRzc3kovNNKkjeS";
    // ==============================================================

    const pointsSpan = document.getElementById("pointsDisplay");
    const totalSpan = document.getElementById("totalPointsStat");
    const dislikeBtn = document.getElementById("dislikeBtn");
    const resetBtn = document.getElementById("resetBtn");
    const toast = document.getElementById("toast");

    function showMessage(msg, isError = false) {
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? "#b14b42" : "#1a1e2b";
        toast.style.opacity = "1";
        setTimeout(() => { toast.style.opacity = "0"; }, 2000);
    }

    async function loadPoints() {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            });
            if (!response.ok) throw new Error("Ошибка загрузки");
            const data = await response.json();
            const points = data.record?.shamelessPoints ?? 0;
            updateUI(points);
        } catch (err) {
            console.warn(err);
            showMessage("Не удалось загрузить баллы, попробуйте позже", true);
            updateUI(0);
        }
    }

    async function savePoints(points) {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": API_KEY
                },
                body: JSON.stringify({ shamelessPoints: points })
            });
            if (!response.ok) throw new Error("Ошибка сохранения");
            updateUI(points);
            showMessage("Баллы обновлены! Позор растёт 💀");
        } catch (err) {
            console.error(err);
            showMessage("Ошибка: не удалось сохранить баллы", true);
        }
    }

    function updateUI(points) {
        pointsSpan.innerText = points;
        totalSpan.innerText = points;
        pointsSpan.classList.add("point-bump");
        setTimeout(() => pointsSpan.classList.remove("point-bump"), 200);
    }

    async function addPoint() {
        let current = parseInt(pointsSpan.innerText);
        await savePoints(current + 1);
    }

    async function resetPoints() {
        if (confirm("Сбросить общий счёт позора? Это увидят все посетители!")) {
            await savePoints(0);
        }
    }

    dislikeBtn.onclick = addPoint;
    resetBtn.onclick = resetPoints;
    loadPoints();
</script>
</body>
</html>
