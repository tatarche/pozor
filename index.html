<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Позорники Москвы — общий счёт</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f9faff 0%, #f0f3fd 100%);
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        .hero { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #1f1f3a, #b14b42);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .table-card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .shame-table { width: 100%; border-collapse: collapse; }
        .shame-table th, .shame-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #ede7f0; }
        .shame-table th { background: #fefaf5; font-weight: 600; text-transform: uppercase; }
        .rank-cell { font-weight: 800; color: #e6645c; }
        .name-cell { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .points-cell { font-weight: 800; font-size: 1.5rem; color: #1f2b3c; }
        .dislike-btn {
            background: #f1e7e6;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .dislike-btn:active { transform: scale(0.96); }
        .info-panel {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.8);
            border-radius: 1.8rem;
            padding: 0.8rem 1.5rem;
        }
        .footer-note { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: gray; }
        @media (max-width: 650px) {
            .shame-table thead { display: none; }
            .shame-table tr { display: block; margin-bottom: 1rem; border-radius: 1rem; background: white; }
            .shame-table td { display: flex; justify-content: space-between; }
            .shame-table td::before { content: attr(data-label); font-weight: 600; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>Позорники Москвы</h1>
        <div class="subhead">⚡ общий счёт позора — работает мгновенно</div>
    </div>
    <div class="table-card">
        <table class="shame-table">
            <thead><tr><th>#</th><th>Позорник</th><th>Позорное деяние</th><th>Баллы позора</th><th>Действие</th></tr></thead>
            <tbody>
                <tr>
                    <td data-label="#" class="rank-cell">01</td>
                    <td data-label="Позорник" class="name-cell"><i class="fas fa-user-slash"></i> Арсений Струков</td>
                    <td data-label="Позорное деяние">Абсолютный антирекорд столицы</td>
                    <td data-label="Баллы позора" class="points-cell" id="pointsDisplay">0</td>
                    <td data-label="Действие"><button class="dislike-btn" id="dislikeBtn"><i class="fas fa-thumbs-down"></i> Дизлайк +1</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="info-panel">
        <span>📊 Общий счёт позора: <strong id="totalPointsStat">0</strong></span>
        <button id="resetBtn" style="background:none;border:1px solid #ccc;border-radius:20px;padding:4px 12px;">Сбросить</button>
    </div>
    <div class="footer-note">✅ Баллы хранятся в Supabase — видны всем посетителям</div>
</div>

<script>
    // ========== ВАШИ ДАННЫЕ SUPABASE ==========
    const SUPABASE_URL = "https://xqvjgniqsywphjybohnx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sX_ycd_Y1tfp9y8YDblLPw_ryBhD9fH";
    // ==========================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const pointsSpan = document.getElementById("pointsDisplay");
    const totalSpan = document.getElementById("totalPointsStat");
    const dislikeBtn = document.getElementById("dislikeBtn");
    const resetBtn = document.getElementById("resetBtn");

    let currentPoints = 0;

    async function loadPoints() {
        const { data, error } = await supabase
            .from('shame_counter')
            .select('points')
            .eq('id', 1)
            .single();
        if (error) {
            console.error("Ошибка загрузки:", error);
            // Если таблицы ещё нет, создадим её автоматически (но лучше сделать через SQL)
            return;
        }
        currentPoints = data?.points || 0;
        updateUI(currentPoints);
    }

    async function updatePoints(newPoints) {
        const { error } = await supabase
            .from('shame_counter')
            .update({ points: newPoints })
            .eq('id', 1);
        if (error) {
            console.error("Ошибка обновления:", error);
            alert("Не удалось обновить баллы. Возможно, таблица не создана.");
            return false;
        }
        currentPoints = newPoints;
        updateUI(currentPoints);
        return true;
    }

    function updateUI(points) {
        pointsSpan.innerText = points;
        totalSpan.innerText = points;
        pointsSpan.style.transform = "scale(1.1)";
        setTimeout(() => pointsSpan.style.transform = "", 150);
    }

    async function addPoint() {
        await updatePoints(currentPoints + 1);
    }

    async function resetPoints() {
        if (confirm("Сбросить общий счёт позора для всех?")) {
            await updatePoints(0);
        }
    }

    dislikeBtn.onclick = addPoint;
    resetBtn.onclick = resetPoints;
    loadPoints();
</script>
</body>
</html>
