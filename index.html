<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Позорники Москвы | Арсений Струков</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 20% 30%, #0a0a1a, #02020c);
            font-family: 'Inter', sans-serif;
            color: #f0f0ff;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимированные фоновые линии (киберпанк-флёр) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255, 70, 85, 0.02) 0px, rgba(255, 70, 85, 0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* Плавающие глитч-эффекты */
        .glow-spot {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(255, 80, 90, 0.15) 0%, rgba(255, 80, 90, 0) 70%);
            border-radius: 50%;
            top: -20%;
            right: -20%;
            z-index: 0;
            pointer-events: none;
            animation: floatGlow 18s infinite alternate;
        }

        .glow-spot-2 {
            left: -10%;
            bottom: -10%;
            top: auto;
            background: radial-gradient(circle, rgba(100, 80, 255, 0.12) 0%, rgba(100, 80, 255, 0) 70%);
            animation: floatGlow 24s infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(5%, 5%) scale(1.2); opacity: 0.7; }
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(0px);
        }

        /* Hero-секция с "позорным" вайбом */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 70, 85, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 70, 85, 0.5);
            border-radius: 100px;
            padding: 0.5rem 1.6rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ff8a92;
            margin-bottom: 1.8rem;
            box-shadow: 0 0 12px rgba(255, 70, 85, 0.2);
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #ffb3b3 40%, #ff6f61 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            text-shadow: 0 0 20px rgba(255, 70, 85, 0.3);
            margin-bottom: 0.5rem;
        }

        .subhead {
            font-size: 1.1rem;
            font-weight: 400;
            color: #b0b5df;
            background: rgba(10, 10, 25, 0.6);
            backdrop-filter: blur(8px);
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Карточка таблицы — стекло + свечение */
        .table-card {
            background: rgba(12, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .shame-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        .shame-table th {
            text-align: left;
            padding: 1.6rem 1.2rem;
            background: rgba(20, 20, 40, 0.7);
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccd0ff;
            border-bottom: 1px solid rgba(255, 70, 85, 0.3);
        }

        .shame-table td {
            padding: 1.4rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
            font-weight: 500;
            transition: all 0.2s;
        }

        .shame-table tr {
            transition: background 0.2s;
        }

        .shame-table tr:hover td {
            background: rgba(255, 70, 85, 0.1);
            box-shadow: inset 0 0 20px rgba(255, 70, 85, 0.05);
        }

        /* Оформление ячеек */
        .rank-cell {
            font-weight: 800;
            font-size: 1.3rem;
            color: #ffb347;
            text-shadow: 0 0 4px #ffb34740;
        }

        .name-cell {
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shame-icon {
            background: rgba(220, 50, 70, 0.25);
            border-radius: 60px;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #ff7b6e;
            box-shadow: 0 0 8px rgba(255, 70, 85, 0.3);
        }

        .title-cell {
            font-weight: 500;
            color: #d0d4ff;
            letter-spacing: -0.2px;
        }

        .level-cell .shame-level {
            background: linear-gradient(145deg, #a13131, #641e1e);
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffcfcf;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Мини-футер с атмосферой */
        .footer-note {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6c6f9a;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 1.5rem;
            backdrop-filter: blur(4px);
        }

        /* Адаптивность под мобилки */
        @media (max-width: 780px) {
            body {
                padding: 1.2rem;
            }
            h1 {
                font-size: 2.8rem;
            }
            .shame-table th, .shame-table td {
                padding: 0.9rem 0.8rem;
            }
            .name-cell {
                font-size: 1rem;
            }
            .shame-icon {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
        }

        @media (max-width: 580px) {
            .shame-table thead {
                display: none;
            }
            .shame-table, .shame-table tbody, .shame-table tr, .shame-table td {
                display: block;
                width: 100%;
            }
            .shame-table tr {
                margin-bottom: 1.2rem;
                background: rgba(15, 15, 35, 0.7);
                border-radius: 1.5rem;
                padding: 0.5rem;
                border: 1px solid rgba(255,255,255,0.1);
            }
            .shame-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
                padding: 0.7rem 1rem;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }
            .shame-table td::before {
                content: attr(data-label);
                font-weight: 700;
                text-transform: uppercase;
                font-size: 0.65rem;
                letter-spacing: 1px;
                color: #ffa09a;
            }
            .level-cell {
                justify-content: flex-end;
            }
        }

        /* Кастомный скролл */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c18;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff5a5a;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="glow-spot"></div>
<div class="glow-spot glow-spot-2"></div>

<div class="container">
    <div class="hero">
        <div class="badge">
            <i class="fas fa-skull-crossbones"></i> <span>ПОЗОРНЫЙ РЕЕСТР №1</span> <i class="fas fa-crown"></i>
        </div>
        <h1>Позорники Москвы</h1>
        <div class="subhead">
            <i class="fas fa-city"></i> Главный антигерой столицы
        </div>
    </div>

    <div class="table-card">
        <table class="shame-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Позорник</th>
                    <th>Позорное деяние</th>
                    <th>Уровень позора</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-label="#" class="rank-cell">
                        <i class="fas fa-hashtag"></i> 01
                    </td>
                    <td data-label="Позорник" class="name-cell">
                        <span class="shame-icon"><i class="fas fa-user-ninja"></i></span>
                        Арсений Струков
                    </td>
                    <td data-label="Позорное деяние" class="title-cell">
                        <i class="fas fa-flag-checkered" style="margin-right: 8px; color: #ff6f61;"></i>
                        Абсолютный антирекорд · Позорный мем Москвы 2026
                    </td>
                    <td data-label="Уровень позора" class="level-cell">
                        <span class="shame-level"><i class="fas fa-fire"></i> МАКСИМАЛЬНЫЙ</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer-note">
        <i class="fas fa-ban"></i> Без счётчиков, без баллов — просто чистейший позор.<br>
        Арсений Струков — единственное имя в позорном списке Москвы.
    </div>
</div>
</body>
</html>
