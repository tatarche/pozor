<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Позорники Москвы — Официальный реестр</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Фон с фирменным градиентом BK-style (чёрный + огненный) */
        .bg-blaze {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, #1a0c00 0%, #000000 90%);
            z-index: -2;
        }

        /* Эффект "пламени" по краям */
        .flame-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(255, 80, 0, 0.03) 0px, rgba(255, 80, 0, 0.03) 2px, transparent 2px, transparent 12px);
            pointer-events: none;
            z-index: -1;
        }

        /* Главный контейнер — как блок с "Whopper" стилем, но без намёков */
        .king-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* Шапка как в Burger King — жирный логотип, но наш */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 3px solid #ff5e00;
            display: inline-block;
            width: 100%;
            padding-bottom: 1rem;
        }

        .badge-flame {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #ff5e00;
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #000000;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(255, 94, 0, 0.5);
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff7e2e, #ffb347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }

        .subhead {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffb347;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        /* Карточка таблицы в стиле "крафтовый блок" BK */
        .menu-card {
            background: #111111;
            border-radius: 2rem;
            border: 1px solid #ff5e00;
            box-shadow: 0 20px 35px -12px rgba(255, 94, 0, 0.3), inset 0 1px 0 rgba(255,94,0,0.2);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* Таблица с фирменным стилем */
        .shame-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Montserrat', sans-serif;
        }

        .shame-table th {
            text-align: left;
            padding: 1.4rem 1.2rem;
            background: #1c1c1c;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff7e2e;
            border-bottom: 2px solid #ff5e00;
        }

        .shame-table td {
            padding: 1.2rem 1.2rem;
            border-bottom: 1px solid rgba(255, 94, 0, 0.2);
            vertical-align: middle;
            font-weight: 500;
            background: #0f0f0f;
            transition: background 0.2s;
        }

        .shame-table tr:hover td {
            background: #1a0f05;
        }

        /* Оформление ячеек под стиль "огонь" */
        .rank-cell {
            font-weight: 900;
            font-size: 1.5rem;
            color: #ff7e2e;
            text-shadow: 0 0 5px rgba(255, 126, 46, 0.5);
        }

        .name-cell {
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shame-icon {
            background: #1f1f1f;
            border-radius: 50px;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #ff7e2e;
            border: 1px solid #ff5e00;
        }

        .title-cell {
            font-weight: 600;
            color: #f0f0f0;
        }

        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(145deg, #2c1800, #0f0800);
            border-left: 4px solid #ff5e00;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #ffb347;
        }

        /* Футер в стиле "подвал бургер кинга" — минимализм */
        .footer-king {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #7a6a5a;
            border-top: 1px solid #ff5e00;
            padding-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        /* Адаптив под мобилы — как у BK: таблица в карточки */
        @media (max-width: 780px) {
            .king-container {
                padding: 1rem;
            }
            h1 {
                font-size: 2.8rem;
            }
            .shame-table th, .shame-table td {
                padding: 0.9rem;
            }
        }

        @media (max-width: 650px) {
            .shame-table thead {
                display: none;
            }
            .shame-table, .shame-table tbody, .shame-table tr, .shame-table td {
                display: block;
                width: 100%;
            }
            .shame-table tr {
                margin-bottom: 1rem;
                background: #111;
                border-radius: 1.2rem;
                border: 1px solid #ff5e00;
                overflow: hidden;
            }
            .shame-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.8rem 1rem;
                border-bottom: 1px solid rgba(255, 94, 0, 0.2);
            }
            .shame-table td::before {
                content: attr(data-label);
                font-weight: 800;
                text-transform: uppercase;
                font-size: 0.7rem;
                color: #ff7e2e;
                letter-spacing: 1px;
            }
            .level-badge {
                justify-content: flex-end;
            }
        }

        /* Анимация кнопок (нет кнопок, но стиль сохраняем) */
        ::selection {
            background: #ff5e00;
            color: black;
        }
    </style>
</head>
<body>
<div class="bg-blaze"></div>
<div class="flame-overlay"></div>

<div class="king-container">
    <div class="header">
        <div class="badge-flame">
            <i class="fas fa-fire"></i> ПОЗОРНЫЙ РЕЕСТР <i class="fas fa-crown"></i>
        </div>
        <h1>Позорники Москвы</h1>
        <div class="subhead">
            <i class="fas fa-map-marker-alt"></i> ГЛАВНЫЙ АНТИГЕРОЙ СТОЛИЦЫ
        </div>
    </div>

    <!-- Основная карточка таблицы -->
    <div class="menu-card">
        <table class="shame-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Позорник</th>
                    <th>Деяние</th>
                    <th>Уровень позора</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-label="#" class="rank-cell">
                        <i class="fas fa-hashtag"></i> 01
                    </td>
                    <td data-label="Позорник" class="name-cell">
                        <span class="shame-icon"><i class="fas fa-user-alt-slash"></i></span>
                        АРСЕНИЙ СТРУКОВ
                    </td>
                    <td data-label="Деяние" class="title-cell">
                        <i class="fas fa-skull-crossbones" style="margin-right: 8px; color: #ff5e00;"></i>
                        Абсолютный антирекорд · Позорный мем Москвы 2026
                    </td>
                    <td data-label="Уровень позора">
                        <span class="level-badge"><i class="fas fa-chart-line"></i> МАКСИМАЛЬНЫЙ</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer-king">
        <span><i class="fas fa-gavel"></i> Безоговорочный позор · Единственный в списке</span>
        <span><i class="fas fa-ban"></i> Без баллов, без действий — только факт</span>
        <span><i class="fas fa-city"></i> Москва, реестр позора 2026</span>
    </div>
</div>
</body>
</html>
